[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rdamsc"
version = "2.2.0"
description = "RDA Metadata Standards Catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "authlib",
    "dulwich",
    "flask",
    "flask-cors",
    "flask-httpauth",
    "flask-login",
    "flask-wtf",
    "github-webhook",
    "google-auth",
    "markupsafe",
    "passlib",
    "rauth",
    "rdflib",
    "requests",
    "tinydb>=4",
    "tinyrecord>=0.2.0",
    "werkzeug",
    "wtforms[email]",
]

[project.optional-dependencies]
dev = [
    "pytest>=6",
]

[tool.setuptools]
packages = ["rdamsc"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'crypt':DeprecationWarning:passlib",
]

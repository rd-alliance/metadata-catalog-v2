[tox]
requires =
    virtualenv>20.2
min_version = 4.0.0
env_list =
    py310
    py312
    format

[testenv]
description = run tests with pytest under {base_python}
set_env =
    SETUPTOOLS_USE_DISTUTILS=stdlib
package = editable
deps =
    -r requirements.txt
extras =
    dev
commands = pytest {tty:--color=yes} --basetemp="{envtmpdir}" {posargs}

[testenv:py312]
description = run tests with coverage under {base_python}
package = editable
deps =
    -r requirements.txt
    coverage
extras =
    dev
commands =
    coverage erase
    coverage run -m --source=rdamsc pytest {tty:--color=yes} --basetemp="{envtmpdir}" {posargs}
    coverage report --omit='.tox/*'
    coverage html --omit='.tox/*'

[testenv:format]
description = run formatter
package = skip
deps =
    ruff>=0.9.0
commands = ruff format {posargs:rdamsc tests}
